<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="К.А.Л — Кворс Аниме Лист. Личная медиа-библиотека с рецензиями, рейтингами и фильтрами." />
    <meta name="theme-color" content="#020203" />
    <title>К.А.Л — Кворс Аниме Лист</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>

    <style>
        :root {
            --core-black: #020203;
            --panel-dark: #08080a;
            --laser-red: #ff052b;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            background-color: var(--core-black);
            background-image: radial-gradient(circle at 50% -20%, rgba(255,5,43,0.12) 0%, transparent 60%);
            color: #efefef;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .brutal-font { font-family: 'Inter', sans-serif; font-weight: 900; }
        .tech-mono   { font-family: 'Space Mono', monospace; }

        .text-block { font-size: 1rem; line-height: 1.7; color: #e2e8f0; }
        .core-panel { background: var(--panel-dark); border: 1px solid #15151a; }

        [x-cloak] { display: none !important; }

        article.card-item {
            content-visibility: auto;
            contain: layout style paint;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            will-change: transform;
        }
        @media (hover: hover) {
            article.card-item:hover { transform: scale(1.04); }
        }
        article.card-item:focus-within {
            outline: 2px solid var(--laser-red);
            outline-offset: 2px;
        }

        .tier-10 {
            border: 2px solid var(--laser-red);
            box-shadow: 0 0 25px rgba(255,5,43,.25), inset 0 0 15px rgba(255,5,43,.1);
        }
        .tier-10::before {
            content: 'TOP_VERDICT';
            position: absolute; top: -10px; left: 10px;
            background: var(--laser-red); color: #000;
            font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 900;
            padding: 0 6px; z-index: 20;
        }

        .tier-mega {
            border: 2px solid transparent;
            background-image: linear-gradient(var(--panel-dark), var(--panel-dark)),
                              linear-gradient(90deg, #ff052b, #200005, #ff052b);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 200% 100%;
            animation: laserShift 3s linear infinite;
            box-shadow: 0 0 35px rgba(255,5,43,.4);
        }
        .tier-mega::before {
            content: 'OVER_LOAD_11+';
            position: absolute; top: -10px; left: 10px;
            background: #fff; color: #000;
            font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 900;
            padding: 0 6px; z-index: 20;
            animation: pulseBlink 1s infinite;
        }

        @keyframes laserShift { 0%{background-position:0%}100%{background-position:200%} }
        @keyframes pulseBlink { 0%,100%{opacity:1} 50%{opacity:.5} }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-enter {
            animation: fadeUp 0.4s ease both;
        }

        .no-poster {
            background: repeating-linear-gradient(45deg,#0a0a0d 0,#0a0a0d 10px,#0d0d11 10px,#0d0d11 20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; border: 1px dashed #2a2a35;
        }
        .no-poster-text {
            font-family: 'Space Mono', monospace; font-size: 8px; color: #444;
            text-align: center; text-transform: uppercase; letter-spacing: .05em; line-height: 1.5;
        }

        @media (max-width: 767px) {
            .modal-inner {
                flex-direction: column !important;
                max-height: 95vh !important;
                border-radius: 0 !important;
                position: fixed !important;
                bottom: 0; left: 0; right: 0;
                width: 100% !important;
                max-width: 100% !important;
            }
            .modal-poster-col { display: none !important; }
            .modal-content-col { padding: 20px 16px !important; }
            .modal-title { font-size: 1.6rem !important; }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--core-black); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--laser-red); }
        * { scrollbar-width: thin; scrollbar-color: #333 var(--core-black); }

        select, input[type="text"] {
            -webkit-appearance: none;
            appearance: none;
            font-size: 16px;
        }

        :focus-visible {
            outline: 2px solid var(--laser-red);
            outline-offset: 2px;
        }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--laser-red);
            outline-offset: 2px;
        }

        .swipe-handle {
            width: 40px; height: 4px; background: #333; border-radius: 2px; margin: 0 auto 12px;
        }
    </style>
    <base target="_blank">
</head>
<body class="antialiased" x-data="mediaApp()" x-init="init()" @keydown.escape.window="modalItem && closeModal()">

    <button type="button" onclick="window.location.href='https://kw0rs.com'"
       class="fixed top-3 right-3 z-[200] flex items-center gap-2 tech-mono bg-[#08080a] border border-[#1c1c24] hover:border-red-900/60 px-3 py-2 transition-all duration-200 hover:shadow-[0_0_15px_rgba(255,5,43,0.2)] cursor-pointer"
       style="font-size:11px;color:#999;">
        <svg width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <path d="M6 1L2 5L6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        В МЕНЮ
    </button>

    <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-6 sm:py-12">

        <header class="mb-8 sm:mb-16 pt-8 sm:pt-0 pb-6 sm:pb-8 border-b-2 border-[#111]">
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-3">
                    <span class="tech-mono text-[10px] text-red-500 bg-red-950/50 px-2 py-0.5 border border-red-900/40 rounded-sm">SYS_V2.1</span>
                    <span class="tech-mono text-[10px] text-zinc-600">SECURE_CHANNEL</span>
                </div>
                <h1 class="brutal-font uppercase tracking-tighter text-white leading-none" style="font-size:clamp(2.2rem,10vw,5rem)">
                    К<span class="text-red-600">.</span>А<span class="text-red-600">.</span>Л
                    <span class="text-zinc-600 font-normal tech-mono block sm:inline mt-1 sm:mt-0" style="font-size:clamp(0.8rem,3vw,1.3rem)">// Кворс Аниме Лист</span>
                </h1>
            </div>
        </header>

        <section class="mb-8 core-panel p-4 sm:p-6 lg:p-8 rounded-sm">

            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4">
                <div class="sm:col-span-2">
                    <label class="tech-mono text-[10px] text-zinc-500 uppercase mb-1.5 block" for="search-input">Поиск</label>
                    <!-- ОПТИМИЗАЦИЯ: используем .debounce для поиска -->
                    <input id="search-input" type="text" x-model.debounce.300ms="search" placeholder="Введи название тайтла..."
                           class="w-full bg-[#030304] border border-[#1a1a22] p-3 text-white focus:outline-none focus:border-red-600 transition-colors text-sm rounded-sm"
                           autocomplete="off" enterkeyhint="search">
                </div>

                <div>
                    <label class="tech-mono text-[10px] text-zinc-500 uppercase mb-1.5 block" for="category-select">Сектор</label>
                    <select id="category-select" x-model="categoryFilter" class="w-full bg-[#030304] border border-[#1a1a22] p-3 text-white focus:outline-none focus:border-red-600 cursor-pointer text-sm rounded-sm">
                        <option value="">ВСЕ</option>
                        <option value="movie">КИНО</option>
                        <option value="show">СЕРИАЛЫ</option>
                        <option value="anime">АНИМЕ</option>
                        <option value="game">ИГРЫ</option>
                        <option value="book">КНИГИ</option>
                    </select>
                </div>

                <div>
                    <label class="tech-mono text-[10px] text-zinc-500 uppercase mb-1.5 block" for="sort-select">Сортировка</label>
                    <select id="sort-select" x-model="sortKey" class="w-full bg-[#030304] border border-[#1a1a22] p-3 text-white focus:outline-none focus:border-red-600 cursor-pointer text-sm rounded-sm">
                        <option value="rating-desc">РЕЙТИНГ ↓</option>
                        <option value="rating-asc">РЕЙТИНГ ↑</option>
                        <option value="year-desc">ГОД (новые)</option>
                        <option value="year-asc">ГОД (старые)</option>
                        <option value="title-asc">А → Я</option>
                        <option value="title-desc">Я → А</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-[#15151a] flex flex-col sm:flex-row sm:items-center gap-4">
                <div class="flex items-center gap-3 flex-1">
                    <span class="tech-mono text-[10px] text-zinc-500 whitespace-nowrap">МИН. ОЦЕНКА:</span>
                    <input type="range" x-model.number="minRating" min="0" max="10" step="1"
                           class="accent-red-600 flex-1 h-1 cursor-pointer" style="max-width:140px" id="rating-range"
                           aria-label="Минимальный рейтинг">
                    <span class="tech-mono text-sm text-red-500 font-bold w-12" x-text="minRating + '/10'"></span>
                </div>

                <div class="flex gap-3 flex-wrap">
                    <button type="button" @click="showFavoritesOnly = !showFavoritesOnly"
                            class="tech-mono text-xs border px-4 py-2.5 transition-colors flex-1 sm:flex-none rounded-sm"
                            :class="showFavoritesOnly ? 'bg-red-950/40 text-red-400 border-red-800' : 'bg-transparent text-zinc-500 border-[#15151a] hover:text-white'">
                        <span x-text="showFavoritesOnly ? '★ ИЗБРАННОЕ' : '☆ ИЗБРАННОЕ'"></span>
                    </button>
                    <button type="button" @click="pickRandomItem()"
                            class="tech-mono text-xs bg-red-950/30 hover:bg-red-900/40 text-red-500 border border-red-900/50 px-4 py-2.5 transition-colors flex-1 sm:flex-none rounded-sm">
                        [СЛУЧАЙНЫЙ]
                    </button>
                    <button type="button" @click="clearFilters()"
                            class="tech-mono text-xs text-zinc-500 hover:text-white px-3 py-2 transition-colors border border-[#15151a] rounded-sm">
                        Сброс
                    </button>
                </div>
            </div>

            <div aria-live="polite" class="mt-4 flex gap-6 tech-mono text-xs text-zinc-600 flex-wrap">
                <span>ВСЕГО: <span class="text-white font-bold" x-text="items.length"></span></span>
                <span class="text-red-900">//</span>
                <span>ПОКАЗАНО: <span class="text-red-500 font-bold" x-text="displayItems.length"></span></span>
                <span x-show="favorites.length" x-cloak class="text-red-800">//</span>
                <span x-show="favorites.length" x-cloak class="text-red-400">ИЗБР: <span class="font-bold" x-text="favorites.length"></span></span>
            </div>
        </section>

        <section x-show="history.length && !loading" x-cloak class="mb-8">
            <h2 class="tech-mono text-[10px] text-zinc-600 uppercase tracking-widest mb-3">Недавно просмотренные</h2>
            <div class="flex gap-2 overflow-x-auto pb-2" style="scrollbar-width:none;">
                <template x-for="item in history" :key="'hist_'+item._id">
                    <button type="button" @click="openModal(item)"
                            class="flex-shrink-0 core-panel p-2 hover:border-zinc-500 transition-colors text-left group min-w-[140px] max-w-[180px] rounded-sm">
                        <div class="relative mb-1.5 rounded-sm overflow-hidden" style="aspect-ratio:2/3;background:#000">
                            <img x-show="item.image" :src="item.image" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition-opacity" loading="lazy">
                            <div x-show="!item.image" class="no-poster w-full h-full">
                                <span class="no-poster-text">постер<br>отсутствует</span>
                            </div>
                        </div>
                        <h4 class="text-[10px] font-bold text-zinc-300 uppercase line-clamp-2 leading-tight" x-text="item.title"></h4>
                        <span class="tech-mono text-[9px] text-zinc-600" x-text="item.year"></span>
                    </button>
                </template>
            </div>
        </section>

        <main class="grid gap-3 sm:gap-5"
              style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));"
              role="list" aria-label="Список тайтлов">
            <template x-for="(item, index) in displayItems" :key="item._id">
                <article role="listitem"
                         @click="openModal(item)"
                         :class="getCardTierClass(item.rating)"
                         class="card-item card-enter core-panel p-1.5 sm:p-2 rounded-sm hover:border-zinc-500 cursor-pointer group flex flex-col h-full relative"
                         :style="'animation-delay:' + (Math.min(index * 0.03, 0.5)) + 's'">

                    <div class="relative overflow-hidden mb-2 rounded-sm" style="aspect-ratio:2/3;background:#000">
                        <div x-show="!item.image" class="no-poster w-full h-full absolute inset-0" x-cloak>
                            <svg width="28" height="28" viewBox="0 0 40 40" fill="none" style="opacity:.25" aria-hidden="true">
                                <rect x="4" y="6" width="32" height="28" rx="1" stroke="#888" stroke-width="1.5" stroke-dasharray="3 2"/>
                                <circle cx="14" cy="16" r="3" stroke="#888" stroke-width="1.5"/>
                                <path d="M4 28l8-8 6 6 5-5 9 9" stroke="#888" stroke-width="1.5" stroke-linejoin="round"/>
                            </svg>
                            <span class="no-poster-text">постер<br>отсутствует</span>
                        </div>
                        <img x-show="item.image" :src="item.image"
                             class="w-full h-full object-cover transition-all duration-500 grayscale-[30%] group-hover:grayscale-0"
                             loading="lazy" @error="item.image = ''" :alt="'Постер: ' + item.title">

                        <div class="absolute top-1.5 right-1.5 bg-black/90 px-1.5 py-0.5 border tech-mono font-bold rounded-sm"
                             style="font-size:9px"
                             :class="item.rating >= 10 ? 'text-red-500 border-red-900' : 'text-white border-zinc-800'">
                            <span x-text="item.rating ? item.rating.toFixed(1) + '/10' : 'Н/Д'"></span>
                        </div>

                        <button type="button"
                                @click.stop="toggleFavorite(item._id)"
                                class="absolute top-1.5 left-1.5 z-10 p-1 transition-transform active:scale-90 bg-black/40 rounded-full hover:bg-black/80"
                                :class="isFavorite(item._id) ? 'text-red-500' : 'text-zinc-400 hover:text-white'"
                                :aria-label="isFavorite(item._id) ? 'Удалить из избранного' : 'Добавить в избранное'">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="flex flex-col flex-1 px-0.5">
                        <span class="tech-mono text-zinc-600 uppercase mb-0.5" style="font-size:8px" x-text="item.typeDisplay"></span>
                        <h3 class="font-bold text-zinc-100 group-hover:text-red-500 transition-colors line-clamp-2 uppercase tracking-tight mb-1.5"
                            style="font-size:11px" x-text="item.title"></h3>
                        <div class="mt-auto pt-1.5 border-t border-[#15151a] flex justify-between tech-mono text-zinc-500"
                             style="font-size:9px">
                            <span x-text="item.year || '—'"></span>
                            <span class="truncate max-w-[60px]" x-text="item.genres?.[0] || ''"></span>
                        </div>
                    </div>
                </article>
            </template>
        </main>

        <div x-show="displayItems.length === 0 && !loading" x-cloak
             class="text-center py-16 border border-dashed border-[#15151a] mt-8 rounded-sm">
            <p class="tech-mono text-xs text-zinc-600 uppercase tracking-widest mb-4">РЕЗУЛЬТАТЫ НЕ НАЙДЕНЫ</p>
            <button type="button" @click="clearFilters()" class="text-xs tech-mono text-red-500 hover:underline focus:outline-none">[ СБРОСИТЬ ФИЛЬТРЫ ]</button>
        </div>

        <div x-show="loadError && !loading" x-cloak
             class="text-center py-16 border border-dashed border-red-900/40 mt-8 rounded-sm">
            <p class="tech-mono text-xs text-red-500 uppercase tracking-widest mb-2">ОШИБКА ЗАГРУЗКИ ДАННЫХ</p>
            <p class="tech-mono text-[10px] text-zinc-600 mb-4">Не удалось загрузить медиа-библиотеку. Проверьте наличие JSON-файлов.</p>
            <button type="button" @click="loadItems()" class="text-xs tech-mono text-white bg-red-900/30 border border-red-800 px-4 py-2 hover:bg-red-900/50 transition-colors rounded-sm">
                [ ПОВТОРИТЬ ]
            </button>
        </div>

        <div x-show="modalItem" x-cloak
             class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/95 backdrop-blur-md"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-y-4"
             role="dialog"
             aria-modal="true"
             :aria-labelledby="modalItem ? 'modal-title' : null"
             @click="if ($event.target === $el) closeModal()">

            <div class="modal-inner bg-[#08080a] border border-[#1c1c24] w-full sm:max-w-5xl flex flex-col sm:flex-row max-h-[95vh] sm:max-h-[90vh] overflow-hidden rounded-sm"
                 x-init="$nextTick(() => { trapFocus($el); initSwipe($el); })">

                <div class="modal-poster-col w-full sm:w-2/5 bg-black p-6 border-b sm:border-b-0 sm:border-r border-[#15151a] flex flex-col flex-shrink-0">
                    <div class="relative w-full overflow-hidden border border-[#15151a] shadow-2xl rounded-sm" style="aspect-ratio:2/3">
                        <div x-show="!modalItem?.image" class="no-poster w-full h-full absolute inset-0" x-cloak>
                            <svg width="50" height="50" viewBox="0 0 40 40" fill="none" style="opacity:.15" aria-hidden="true">
                                <rect x="4" y="6" width="32" height="28" rx="1" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2"/>
                                <circle cx="14" cy="16" r="3" stroke="#aaa" stroke-width="1.5"/>
                                <path d="M4 28l8-8 6 6 5-5 9 9" stroke="#aaa" stroke-width="1.5" stroke-linejoin="round"/>
                            </svg>
                            <span class="no-poster-text" style="font-size:11px;color:#555">постер<br>временно отсутствует</span>
                        </div>
                        <img x-show="modalItem?.image" :src="modalItem?.image" class="w-full h-full object-cover" @error="modalItem.image=''" :alt="'Постер: ' + modalItem?.title">
                    </div>
                    <div class="grid grid-cols-2 gap-2 tech-mono text-center mt-4">
                        <div class="bg-[#030304] p-3 border border-[#15151a] rounded-sm">
                            <span class="text-[9px] text-zinc-600 block uppercase">SCORE</span>
                            <span class="text-xl font-bold text-red-500" x-text="(modalItem?.rating || 0) + '/10'"></span>
                        </div>
                        <div class="bg-[#030304] p-3 border border-[#15151a] rounded-sm">
                            <span class="text-[9px] text-zinc-600 block uppercase">YEAR</span>
                            <span class="text-xl font-bold text-white" x-text="modalItem?.year || '—'"></span>
                        </div>
                    </div>
                </div>

                <div class="modal-content-col flex-1 p-5 sm:p-10 overflow-y-auto flex flex-col">
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <div class="flex-1 min-w-0">
                            <div class="sm:hidden swipe-handle" aria-hidden="true"></div>

                            <div class="flex items-center gap-3 mb-2 sm:hidden">
                                <span class="tech-mono text-red-500 font-bold" style="font-size:11px" x-text="(modalItem?.rating || 0) + '/10'"></span>
                                <span class="tech-mono text-zinc-500" style="font-size:11px" x-text="modalItem?.year || '—'"></span>
                            </div>
                            <span class="tech-mono text-xs text-red-500 uppercase font-bold" x-text="modalItem?.typeDisplay"></span>
                            <h2 id="modal-title" class="modal-title brutal-font text-white uppercase tracking-tighter mt-1 leading-tight break-words" x-text="modalItem?.title"></h2>
                        </div>
                        <button type="button" @click="closeModal()"
                                class="tech-mono text-zinc-500 hover:text-white bg-[#030304] border border-[#15151a] flex-shrink-0 px-3 py-2 rounded-sm"
                                style="font-size:11px" aria-label="Закрыть">✕</button>
                    </div>

                    <div class="flex border-b border-[#15151a] mb-5">
                        <button type="button" @click="showReview = true"
                                class="px-3 py-2.5 tech-mono text-xs uppercase tracking-wider border-b-2 transition-all"
                                :class="showReview ? 'border-red-600 text-white font-bold bg-red-950/20' : 'border-transparent text-zinc-500'"
                                :aria-selected="showReview">
                            Рецензия
                        </button>
                        <button type="button" @click="showReview = false"
                                class="px-3 py-2.5 tech-mono text-xs uppercase tracking-wider border-b-2 transition-all"
                                :class="!showReview ? 'border-red-600 text-white font-bold bg-red-950/20' : 'border-transparent text-zinc-500'"
                                :aria-selected="!showReview">
                            Описание
                        </button>
                    </div>

                    <div class="text-block flex-1 overflow-y-auto">
                        <div x-show="showReview" id="modal-review">
                            <p class="whitespace-pre-line text-zinc-100 italic font-medium text-sm sm:text-base"
                               x-text="modalItem?.review || 'Рецензия ещё не добавлена.'"></p>
                        </div>
                        <div x-show="!showReview" id="modal-desc">
                            <p class="text-zinc-400 text-sm sm:text-base"
                               x-text="modalItem?.description || 'Описание отсутствует.'"></p>
                        </div>
                    </div>

                    <div class="mt-5 flex flex-wrap gap-2">
                        <template x-for="genre in modalItem?.genres" :key="genre">
                            <span class="tech-mono bg-[#030304] px-2.5 py-1 text-zinc-400 border border-[#15151a] rounded-sm"
                                  style="font-size:10px" x-text="genre"></span>
                        </template>
                    </div>

                    <div class="mt-6 pt-4 border-t border-[#15151a] flex gap-3">
                        <button type="button" @click="toggleFavorite(modalItem._id);"
                                class="tech-mono text-xs px-4 py-2.5 border transition-colors rounded-sm"
                                :class="isFavorite(modalItem._id) ? 'bg-red-950/40 text-red-400 border-red-800' : 'bg-[#030304] text-zinc-400 border-[#15151a] hover:text-white'">
                            <span x-text="isFavorite(modalItem._id) ? '★ В ИЗБРАННОМ' : '☆ В ИЗБРАННОЕ'"></span>
                        </button>
                        <button type="button" @click="shareItem()"
                                x-show="canShare"
                                class="tech-mono text-xs bg-[#030304] text-zinc-400 border border-[#15151a] hover:text-white px-4 py-2.5 transition-colors rounded-sm">
                            ПОДЕЛИТЬСЯ
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <button type="button"
                x-show="showScrollTop"
                x-transition
                @click="window.scrollTo({top:0,behavior:'smooth'})"
                class="fixed bottom-6 right-6 z-40 bg-[#08080a] border border-[#1c1c24] text-zinc-500 hover:text-white hover:border-red-900/60 p-3 transition-all shadow-lg rounded-sm"
                aria-label="Наверх">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 15l-6-6-6 6"/>
            </svg>
        </button>

        <div x-show="loading" x-cloak class="fixed inset-0 bg-[#020203] z-[100] flex flex-col items-center justify-center gap-3">
            <div class="h-1 w-48 bg-zinc-900 overflow-hidden relative rounded-full">
                <div class="absolute h-full bg-red-600 top-0 left-0 transition-all duration-300" :style="'width:' + loadProgress + '%'"></div>
            </div>
            <p class="tech-mono text-[10px] text-red-500 tracking-widest uppercase">LOADING_CORE_DATA... <span x-text="loadProgress + '%'"></span></p>
        </div>
    </div>

    <script>
        function mediaApp() {
            return {
                search: '',
                categoryFilter: '',
                sortKey: 'rating-desc',
                minRating: 0,
                showFavoritesOnly: false,

                items: [],
                displayItems: [],
                favorites: [],
                history: [],

                loading: true,
                loadError: false,
                loadProgress: 0,
                modalItem: null,
                showReview: true,
                showScrollTop: false,
                canShare: typeof navigator !== 'undefined' && !!navigator.share,

                files: ['anime_data.json','movies_data.json','games_data.json','books_data.json','cartoons_data.json'],

                init() {
                    this.loadFilters();
                    this.loadFavorites();
                    this.loadHistory();
                    this.loadItems();

                    ['search','categoryFilter','sortKey','minRating','showFavoritesOnly','items'].forEach(key => {
                        this.$watch(key, () => {
                            this.updateDisplay();
                            this.saveFilters();
                        });
                    });

                    this._onScroll = () => { this.showScrollTop = window.scrollY > 500; };
                    window.addEventListener('scroll', this._onScroll, { passive: true });

                    this._onVis = () => { if (!document.hidden) this.saveHistory(); };
                    document.addEventListener('visibilitychange', this._onVis);
                },

                destroy() {
                    window.removeEventListener('scroll', this._onScroll);
                    document.removeEventListener('visibilitychange', this._onVis);
                },

                async loadItems() {
                    this.loading = true;
                    this.loadError = false;
                    this.loadProgress = 0;
                    let loaded = 0;

                    try {
                        const results = await Promise.all(
                            this.files.map(async (f) => {
                                try {
                                    const r = await fetch(f, { cache: 'no-cache' });
                                    loaded++;
                                    this.loadProgress = Math.round((loaded / this.files.length) * 100);
                                    if (!r.ok) return [];
                                    return await r.json();
                                } catch (e) {
                                    loaded++;
                                    this.loadProgress = Math.round((loaded / this.files.length) * 100);
                                    return [];
                                }
                            })
                        );

                        this.items = results.flat().map((item, idx) => ({
                            ...item,
                            _id: item.id || ('item_' + idx + '_' + (item.title || '').slice(0,10).replace(/\s+/g,'_')),
                            rating: parseFloat(item.rating) || 0,
                            year: parseInt(item.year) || 0,
                            typeDisplay: this.getType(item.type)
                        }));

                        if (this.items.length === 0) this.loadError = true;
                        this.updateDisplay();
                    } catch (e) {
                        console.error('Load error:', e);
                        this.loadError = true;
                    } finally {
                        this.loading = false;
                    }
                },

                getType(t) {
                    const m = { movie:'CINEMA', show:'SERIES', anime:'ANIME', game:'GAME', book:'LITERATURE', cartoon:'CARTOON' };
                    return m[t] || 'RECORD';
                },

                getCardTierClass(rating) {
                    if (rating > 10) return 'tier-mega';
                    if (rating === 10) return 'tier-10';
                    return '';
                },

                updateDisplay() {
                    let f = this.items.filter(i => {
                        const matchesSearch = !this.search || 
                            i.title.toLowerCase().includes(this.search.toLowerCase());
                        const matchesCategory = !this.categoryFilter || i.type === this.categoryFilter;
                        const matchesRating = !this.minRating || i.rating >= this.minRating;
                        const matchesFav = !this.showFavoritesOnly || this.favorites.includes(i._id);
                        return matchesSearch && matchesCategory && matchesRating && matchesFav;
                    });

                    f.sort((a, b) => {
                        switch(this.sortKey) {
                            case 'rating-desc': return b.rating - a.rating;
                            case 'rating-asc':  return a.rating - b.rating;
                            case 'year-desc':   return b.year - a.year;
                            case 'year-asc':    return a.year - b.year;
                            case 'title-asc':   return a.title.localeCompare(b.title, 'ru');
                            case 'title-desc':  return b.title.localeCompare(a.title, 'ru');
                            default: return 0;
                        }
                    });

                    this.displayItems = f;
                },

                openModal(item) {
                    this.modalItem = item;
                    this.showReview = !!item.review;
                    document.body.style.overflow = 'hidden';
                    this.addToHistory(item);
                },

                closeModal() {
                    this.modalItem = null;
                    document.body.style.overflow = '';
                },

                trapFocus(el) {
                    if (!el) return;
                    const focusable = el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                    if (!focusable.length) return;
                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];

                    this._trapHandler = (e) => {
                        if (e.key !== 'Tab') return;
                        if (e.shiftKey && document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        } else if (!e.shiftKey && document.activeElement === last) {
                            e.preventDefault();
                            first.focus();
                        }
                    };
                    el.addEventListener('keydown', this._trapHandler);
                    first.focus();
                },

                initSwipe(el) {
                    if (!el) return;
                    let startY = 0;
                    const inner = el; 
                    if (!inner) return;

                    const onStart = (e) => { startY = e.touches[0].clientY; };
                    const onMove = (e) => {
                        const currentY = e.touches[0].clientY;
                        const diff = currentY - startY;
                        
                        // Закрытие при свайпе вниз (если прокрутка в самом верху)
                        if (diff > 80 && inner.scrollTop <= 0) {
                            this.closeModal();
                        }
                    };
                    inner.addEventListener('touchstart', onStart, { passive: true });
                    inner.addEventListener('touchmove', onMove, { passive: true });
                },

                clearFilters() {
                    this.search = '';
                    this.categoryFilter = '';
                    this.sortKey = 'rating-desc';
                    this.minRating = 0;
                    this.showFavoritesOnly = false;
                    this.saveFilters();
                },

                pickRandomItem() {
                    const l = this.displayItems;
                    if (l.length) this.openModal(l[Math.floor(Math.random() * l.length)]);
                },

                toggleFavorite(id) {
                    if (this.favorites.includes(id)) {
                        this.favorites = this.favorites.filter(f => f !== id);
                    } else {
                        this.favorites.push(id);
                    }
                    localStorage.setItem('kal-favorites', JSON.stringify(this.favorites));
                },

                isFavorite(id) {
                    return this.favorites.includes(id);
                },

                addToHistory(item) {
                    this.history = [item, ...this.history.filter(h => h._id !== item._id)].slice(0, 10);
                    this.saveHistory();
                },

                saveHistory() {
                    try { localStorage.setItem('kal-history', JSON.stringify(this.history)); } catch(e){}
                },

                loadHistory() {
                    try {
                        const raw = localStorage.getItem('kal-history');
                        if(raw) this.history = JSON.parse(raw) || [];
                    } catch(e) { this.history = []; }
                },

                loadFavorites() {
                    try {
                        const raw = localStorage.getItem('kal-favorites');
                        if(raw) this.favorites = JSON.parse(raw) || [];
                    } catch(e) { this.favorites = []; }
                },

                saveFilters() {
                    const data = {
                        search: this.search,
                        categoryFilter: this.categoryFilter,
                        sortKey: this.sortKey,
                        minRating: this.minRating,
                        showFavoritesOnly: this.showFavoritesOnly
                    };
                    try { localStorage.setItem('kal-filters', JSON.stringify(data)); } catch(e){}
                },

                loadFilters() {
                    try {
                        const raw = localStorage.getItem('kal-filters');
                        if (!raw) return;
                        const data = JSON.parse(raw);
                        if(data) {
                            this.search = data.search || '';
                            this.categoryFilter = data.categoryFilter || '';
                            this.sortKey = data.sortKey || 'rating-desc';
                            this.minRating = data.minRating || 0;
                            this.showFavoritesOnly = data.showFavoritesOnly || false;
                        }
                    } catch(e) {}
                },

                shareItem() {
                    if (!this.modalItem || !navigator.share) return;
                    navigator.share({
                        title: this.modalItem.title,
                        text: this.modalItem.review || this.modalItem.description || '',
                    }).catch(() => {});
                }
            }
        }
    </script>
</body>
</html>
