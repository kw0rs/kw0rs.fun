<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Любовное колесо — спины</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150c1e;
    --surface: #211432;
    --surface-2: #2c1c40;
    --pink: #ff4d94;
    --gold: #ffcb61;
    --text: #f5ecff;
    --muted: #9d87b3;
    --line: rgba(245,236,255,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 16px 32px;
    position: relative;
    overflow-x:hidden;
  }

  /* ambient texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(1px 1px at 12% 22%, rgba(255,203,97,0.5), transparent),
      radial-gradient(1px 1px at 82% 15%, rgba(255,77,148,0.5), transparent),
      radial-gradient(1.5px 1.5px at 68% 78%, rgba(255,203,97,0.4), transparent),
      radial-gradient(1px 1px at 25% 88%, rgba(255,77,148,0.4), transparent),
      radial-gradient(1px 1px at 92% 60%, rgba(245,236,255,0.35), transparent);
    pointer-events:none;
    z-index:0;
    animation: twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.5; }
    50%{ opacity:1; }
  }

  .stage-glow{
    position:fixed;
    top:-24%;
    left:50%;
    transform:translateX(-50%);
    width:960px;
    height:960px;
    background: radial-gradient(circle, rgba(255,77,148,0.16) 0%, rgba(255,203,97,0.05) 35%, transparent 70%);
    filter: blur(10px);
    animation: pulse-glow 6s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes pulse-glow{
    0%,100% { opacity:0.7; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.08); }
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:780px;
  }

  /* ===== HEADER ===== */
  .header{
    text-align:center;
    margin-bottom:32px;
  }
  .crest{
    width:52px; height:52px;
    margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background: linear-gradient(160deg, rgba(255,77,148,0.18), rgba(255,203,97,0.1));
    border:1px solid rgba(255,203,97,0.35);
    box-shadow: 0 0 0 6px rgba(255,77,148,0.06), 0 14px 30px -14px rgba(255,77,148,0.6);
  }
  .crest svg{ width:24px; height:24px; }

  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color: var(--gold);
    margin-bottom:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    height:1px;
    width:28px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .eyebrow::after{ background: linear-gradient(90deg, var(--gold), transparent); }

  .headline{
    font-family:'Unbounded', sans-serif;
    font-weight:900;
    font-size: clamp(26px, 4.6vw, 36px);
    letter-spacing:-0.01em;
    margin:0 0 8px;
    background: linear-gradient(135deg, var(--text) 30%, var(--pink) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subline{
    font-size:13.5px;
    color: var(--muted);
    font-weight:600;
    margin:0;
  }

  /* ===== REEL CARDS ===== */
  .spins-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:14px;
    margin-bottom:18px;
  }
  @media (max-width: 640px){
    .spins-grid{ grid-template-columns: 1fr; }
  }

  .spin-card{
    position:relative;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:16px 16px 18px;
    box-shadow: 0 30px 60px -28px rgba(0,0,0,0.6);
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }
  .spin-card.spinning{
    border-color: rgba(255,77,148,0.45);
    box-shadow: 0 0 0 1px rgba(255,77,148,0.25), 0 30px 60px -28px rgba(0,0,0,0.6), 0 0 24px -4px rgba(255,77,148,0.35);
    transform: translateY(-1px);
  }
  /* marquee corner ticks */
  .spin-card::before, .spin-card::after{
    content:"";
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    background: var(--gold);
    opacity:0.35;
    top:10px;
  }
  .spin-card::before{ left:10px; }
  .spin-card::after{ right:10px; background:var(--pink); }
  .spin-card.spinning::before, .spin-card.spinning::after{
    animation: bulb-flicker 0.9s ease-in-out infinite;
    opacity:0.9;
  }
  @keyframes bulb-flicker{
    0%,100%{ opacity:0.35; filter: drop-shadow(0 0 0 transparent); }
    50%{ opacity:1; filter: drop-shadow(0 0 6px currentColor); }
  }

  .spin-label-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:12px;
  }
  .spin-icon{
    width:16px; height:16px;
    flex:none;
    opacity:0.7;
  }
  .spin-label{
    font-family:'Unbounded', sans-serif;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.12em;
    color: var(--muted);
    text-transform:uppercase;
  }

  .reel-mask{
    position:relative;
    overflow:hidden;
    background: rgba(0,0,0,0.28);
    border-radius:14px;
    border:1px solid var(--line);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
  }
  /* center selection window */
  .reel-mask::before{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    transform: translateY(-0.5px);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16) 20%, rgba(255,255,255,0.16) 80%, transparent);
    z-index:5;
    pointer-events:none;
  }
  .reel-strip{
    display:flex;
    flex-direction:column;
    will-change:transform;
  }
  .reel-item{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    width:100%;
    padding:0 8px;
    font-family:'Unbounded', sans-serif;
    color: var(--text);
  }
  .reel-fade-top, .reel-fade-bottom{
    position:absolute; left:0; right:0; height:40%;
    z-index:6; pointer-events:none;
  }
  .reel-fade-top{ top:0; background: linear-gradient(var(--surface), transparent); }
  .reel-fade-bottom{ bottom:0; background: linear-gradient(transparent, var(--surface-2)); }

  .skip-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    gap:8px;
  }
  .skip-count{
    font-size:11.5px;
    font-weight:700;
    color: var(--muted);
    letter-spacing:0.02em;
  }
  .skip-count b{
    color: var(--pink);
    font-weight:800;
    font-family:'Space Mono', monospace;
    font-size:13px;
  }

  button.main{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    padding:15px 28px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  button.main:active:not(:disabled){ transform: scale(0.97); }
  button.main:disabled{ opacity:0.4; cursor:not-allowed; }

  .btn-spin{
    position:relative;
    width:100%;
    background: linear-gradient(135deg, var(--pink), #ff7ab0);
    color:#1a0a12;
    box-shadow: 0 10px 26px -10px rgba(255,77,148,0.6);
    font-size:17px;
    padding:19px 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    overflow:hidden;
  }
  .btn-spin::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.35) 34%, transparent 48%);
    transform: translateX(-120%);
  }
  .btn-spin:hover:not(:disabled){ box-shadow: 0 12px 30px -8px rgba(255,77,148,0.8); }
  .btn-spin:hover:not(:disabled)::after{ transform: translateX(120%); transition: transform 0.7s ease; }
  .btn-spin svg{ width:18px; height:18px; }
  .btn-spin.is-spinning svg{ animation: spin-icon 0.9s linear infinite; }
  @keyframes spin-icon{ to{ transform: rotate(360deg); } }

  .btn-secondary{
    background: transparent;
    color: var(--muted);
    border:1px solid var(--line);
    font-size:11.5px;
    padding:9px 14px;
  }
  .btn-secondary:hover:not(:disabled){ color: var(--text); border-color: var(--muted); }

  /* ===== TIMER ===== */
  .timer-block{
    position:relative;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px 28px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    box-shadow: 0 30px 60px -28px rgba(0,0,0,0.6);
  }
  /* ticket perforation */
  .timer-block::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:132px;
    width:0;
    border-left: 2px dashed var(--line);
  }
  @media (max-width:520px){ .timer-block::before{ display:none; } }

  .timer-side{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .timer-kicker{
    font-family:'Unbounded', sans-serif;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--muted);
  }
  .timer-val{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(46px, 8.5vw, 72px);
    letter-spacing:-1px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height:1;
  }
  .timer-val.low{
    color: var(--pink);
    animation: time-pulse 1s ease-in-out infinite;
  }
  @keyframes time-pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.55; }
  }
  .timer-controls{
    display:flex;
    gap:8px;
  }
  .timer-controls button{ flex:1; }

  .btn-timer-start{
    background: rgba(255,203,97,0.12);
    border:1px solid rgba(255,203,97,0.4);
    color: var(--gold);
  }
  .btn-timer-start.running{
    background: rgba(255,77,148,0.15);
    border-color: rgba(255,77,148,0.5);
    color: var(--pink);
  }

  /* ===== FOOTER CREDIT ===== */
  .credit{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:26px;
    font-family:'Manrope', sans-serif;
    font-size:11.5px;
    font-weight:600;
    color: var(--muted);
    letter-spacing:0.03em;
  }
  .credit .dot{
    width:4px; height:4px;
    border-radius:50%;
    background: var(--pink);
    opacity:0.6;
  }
  .credit .brand{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.04em;
    background: linear-gradient(90deg, var(--gold), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
</style>
</head>
<body x-data="tribuneApp()">

<div class="stage-glow"></div>

<div class="wrap">

  <div class="header">
    <div class="crest">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21s-7.5-4.6-10-9.1C0.3 8.3 2 4.5 5.7 4c2.2-0.3 4.2 0.9 6.3 3 2.1-2.1 4.1-3.3 6.3-3 3.7 0.5 5.4 4.3 3.7 7.9C19.5 16.4 12 21 12 21z" fill="var(--pink)" opacity="0.9"/>
      </svg>
    </div>
    <div class="eyebrow">Любовное колесо</div>
    <h1 class="headline">Крути барабан</h1>
    <p class="subline">Скипы · время · пол — три спина, один результат</p>
  </div>

  <div class="spins-grid">

    <!-- SKIP SPIN -->
    <div class="spin-card" :class="isSpinning?'spinning':''">
      <div class="spin-label-row">
        <svg class="spin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="var(--pink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="spin-label">Спин: скипы</span>
      </div>
      <div class="reel-mask" :style="`height:${itemHeight}px`">
        <div class="reel-fade-top"></div>
        <div class="reel-fade-bottom"></div>
        <div class="reel-strip" :style="`transform:translateY(-${skipOffset}px);transition:${skipTransition}`">
          <template x-for="(item,idx) in reelSkips" :key="'sk'+idx">
            <div class="reel-item" :style="`height:${itemHeight}px; font-size:44px; font-weight:900; color:var(--pink)`" x-text="item"></div>
          </template>
        </div>
      </div>
      <div class="skip-row">
        <span class="skip-count">Осталось: <b x-text="skipsLeft"></b></span>
        <button class="main btn-secondary" @click="useSkip()" :disabled="isSpinning||skipsLeft<=0">−1 скип</button>
      </div>
    </div>

    <!-- TIME SPIN -->
    <div class="spin-card" :class="isSpinning?'spinning':''">
      <div class="spin-label-row">
        <svg class="spin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8.5" stroke="var(--gold)" stroke-width="2"/><path d="M12 7.5V12l3 2" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="spin-label">Спин: время</span>
      </div>
      <div class="reel-mask" :style="`height:${itemHeight}px`">
        <div class="reel-fade-top"></div>
        <div class="reel-fade-bottom"></div>
        <div class="reel-strip" :style="`transform:translateY(-${timeOffset}px);transition:${timeTransition}`">
          <template x-for="(item,idx) in reelTime" :key="'tm'+idx">
            <div class="reel-item" :style="`height:${itemHeight}px; font-size:20px; font-weight:700`" x-text="item"></div>
          </template>
        </div>
      </div>
    </div>

    <!-- GENDER SPIN -->
    <div class="spin-card" :class="isSpinning?'spinning':''">
      <div class="spin-label-row">
        <svg class="spin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="9" r="5" stroke="var(--text)" stroke-width="2" opacity="0.75"/><path d="M12 14v7M9 18h6" stroke="var(--text)" stroke-width="2" stroke-linecap="round" opacity="0.75"/></svg>
        <span class="spin-label">Спин: пол</span>
      </div>
      <div class="reel-mask" :style="`height:${itemHeight}px`">
        <div class="reel-fade-top"></div>
        <div class="reel-fade-bottom"></div>
        <div class="reel-strip" :style="`transform:translateY(-${genderOffset}px);transition:${genderTransition}`">
          <template x-for="(item,idx) in reelGender" :key="'gd'+idx">
            <div class="reel-item" :style="`height:${itemHeight}px; font-size:17px; font-weight:700`" x-text="item"></div>
          </template>
        </div>
      </div>
    </div>

  </div>

  <!-- TIMER -->
  <div class="timer-block">
    <div class="timer-side">
      <span class="timer-kicker">Таймер</span>
      <div class="timer-val" :class="timeLeft<10&&timeLeft>0?'low':''" x-text="formatTime(timeLeft)"></div>
    </div>
    <div class="timer-controls">
      <button class="main btn-timer-start" :class="isTimerRunning?'running':''" @click="toggleTimer()">
        <span x-text="isTimerRunning?'Стоп':'Старт'"></span>
      </button>
      <button class="main btn-secondary" @click="resetTimer()">Сброс</button>
    </div>
  </div>

  <button class="main btn-spin" :class="isSpinning?'is-spinning':''" @click="spin()" :disabled="isSpinning">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 4v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span x-text="isSpinning?'Крутится…':'Крутить колесо'"></span>
  </button>

  <div class="credit">
    <span>by kw0rs</span>
    <span class="dot"></span>
    <span class="brand">for Lounge</span>
  </div>

</div>

<script>
function tribuneApp(){
  // ====== КОНФИГ ШАНСОВ ======
  const weights={
    skips:[
      {val:1,w:4},
      {val:2,w:5},
      {val:3,w:3}
    ],
    time:[
      {val:'30 СЕК', w:4, s:30},
      {val:'1 МИН',  w:5, s:60},
      {val:'1.5 МИН',w:5, s:90},
      {val:'2 МИН',  w:4, s:120}
    ],
    gender:[
      {val:'Мальчик',      w:5},
      {val:'Девочка',      w:5},
      {val:'Любой гендер', w:3},
      {val:'Без гендера',  w:1}
    ]
  };
  // ===========================

  function weightedRandom(items){
    const total=items.reduce((acc,i)=>acc+i.w,0);
    let rand=Math.random()*total;
    for(const i of items){
      rand-=i.w;
      if(rand<0) return i;
    }
    return items[items.length-1];
  }

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildStrip(pool,finalValue,repeats){
    let strip=[];
    for(let r=0;r<repeats;r++){
      strip=strip.concat(shuffle(pool));
    }
    strip.push(finalValue);
    return strip;
  }

  const timeOptions=weights.time.map(i=>i.val);
  const genderOptions=weights.gender.map(i=>i.val);
  const skipOptions=weights.skips.map(i=>i.val);

  return{
    isSpinning:false,
    skipsLeft:0,

    timeLeft:90,
    activeDuration:90,
    isTimerRunning:false,
    timerInterval:null,

    itemHeight:96,
    reelSkips:[0],
    reelTime:['—'],
    reelGender:['—'],
    skipOffset:0,
    timeOffset:0,
    genderOffset:0,
    skipTransition:'none',
    timeTransition:'none',
    genderTransition:'none',

    formatTime(s){
      const m=Math.floor(s/60);
      const sec=s%60;
      return`${m}:${sec.toString().padStart(2,'0')}`;
    },

    useSkip(){ if(this.skipsLeft>0) this.skipsLeft--; },

    toggleTimer(){
      if(this.isTimerRunning){
        clearInterval(this.timerInterval);
      }else{
        if(this.timeLeft<=0) return;
        this.timerInterval=setInterval(()=>{
          if(this.timeLeft>0) this.timeLeft--;
          else{ clearInterval(this.timerInterval); this.isTimerRunning=false; }
        },1000);
      }
      this.isTimerRunning=!this.isTimerRunning;
    },

    resetTimer(){
      clearInterval(this.timerInterval);
      this.isTimerRunning=false;
      this.timeLeft=this.activeDuration;
    },

    async spin(){
      this.isSpinning=true;
      this.resetTimer();

      const skipRes=weightedRandom(weights.skips);
      const timeRes=weightedRandom(weights.time);
      const genderRes=weightedRandom(weights.gender);

      this.reelSkips=buildStrip(skipOptions,skipRes.val,6);
      this.reelTime=buildStrip(timeOptions,timeRes.val,6);
      this.reelGender=buildStrip(genderOptions,genderRes.val,6);

      // instant reset, no transition
      this.skipTransition='none';
      this.timeTransition='none';
      this.genderTransition='none';
      this.skipOffset=0;
      this.timeOffset=0;
      this.genderOffset=0;

      await this.$nextTick();

      // stagger stops left to right, 0.5s apart
      const skipDuration=1.4, timeDuration=1.9, genderDuration=2.4;

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          this.skipTransition=`transform ${skipDuration}s cubic-bezier(0.13,0.85,0.15,1)`;
          this.timeTransition=`transform ${timeDuration}s cubic-bezier(0.13,0.85,0.15,1)`;
          this.genderTransition=`transform ${genderDuration}s cubic-bezier(0.13,0.85,0.15,1)`;
          this.skipOffset=(this.reelSkips.length-1)*this.itemHeight;
          this.timeOffset=(this.reelTime.length-1)*this.itemHeight;
          this.genderOffset=(this.reelGender.length-1)*this.itemHeight;
        });
      });

      setTimeout(()=>{
        this.skipsLeft=skipRes.val;
        this.activeDuration=timeRes.s;
        this.timeLeft=this.activeDuration;
        this.isSpinning=false;
      }, genderDuration*1000 + 100);
    }
  }
}
</script>
