<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Любовь в вопросах — генератор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150c1e;
    --surface: #211432;
    --surface-2: #2c1c40;
    --pink: #ff4d94;
    --gold: #ffcb61;
    --text: #f5ecff;
    --muted: #9d87b3;
    --line: rgba(245,236,255,0.06); /* Чуть тоньше */
    /* Новые переменные для теней с оттенком */
    --shadow-dark: rgba(10, 5, 15, 0.5);
    --shadow-pink: rgba(255, 77, 148, 0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px; /* Чуть больше отступы */
    position: relative;
    overflow-x:hidden;
    -webkit-font-smoothing: antialiased; /* Улучшенный рендеринг шрифтов */
    -moz-osx-font-smoothing: grayscale;
  }
  
  /* ambient texture - улучшена */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(var(--text) 1px, transparent 1px);
    background-size: 4px 4px; /* Чуть реже */
    pointer-events:none;
    z-index:0;
    opacity: 0.02; /* Очень тонко */
  }
  
  /* Улучшенное фоновое свечение */
  .stage-glow{
    position:fixed;
    top:-15%; /* Смещено чуть ниже */
    left:50%;
    transform:translateX(-50%);
    width:1000px;
    height:1000px;
    background: radial-gradient(circle, rgba(255,77,148,0.12) 0%, rgba(255,203,97,0.04) 30%, transparent 65%);
    filter: blur(40px); /* Больше размытия для мягкости */
    animation: pulse-glow 8s ease-in-out infinite; /* Чуть медленнее */
    pointer-events:none;
    z-index:0;
    backface-visibility: hidden;
  }
  @keyframes pulse-glow{
    0%,100% { opacity:0.6; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.05); }
  }
  
  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
  }
  
  /* Кредит стилизован как в колесе */
  .credit{
    text-align:center;
    font-family:'Manrope', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.06em;
    color: var(--muted);
    text-transform:uppercase;
    margin-bottom:12px;
    opacity:0.7;
  }
  .credit .brand {
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:10px;
    letter-spacing:0.04em;
    background: linear-gradient(90deg, var(--gold), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* Eyebrow улучшен */
  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:11px; /* Чуть меньше */
    letter-spacing:0.25em; /* Больше разрядка */
    text-transform:uppercase;
    color: var(--gold);
    margin-bottom:32px;
    opacity: 0.9;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    height:1px;
    width:36px;
    /* Градиент тающий к краям */
    background: linear-gradient(90deg, transparent, rgba(255,203,97,0.5), transparent);
  }

  /* Сцена улучшена (Rim light, тени, ховер) */
  .stage{
    position:relative;
    background: linear-gradient(180deg, var(--surface) 0%, #1a1028 100%);
    border:1px solid var(--line);
    border-radius:24px; /* Больше скругление */
    padding:56px 40px;
    text-align:center;
    /* Тень с оттенком фона и внутренний rim-light */
    box-shadow: 
      inset 0 1px 1px rgba(245,236,255,0.05),
      0 30px 60px -20px var(--shadow-dark);
    height:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .stage:hover {
    transform: translateY(-3px);
    box-shadow: 
      inset 0 1px 1px rgba(245,236,255,0.08),
      0 35px 70px -20px var(--shadow-dark);
  }

  .round-label{
    position:absolute;
    top:20px;
    left:28px;
    font-family:'Unbounded', sans-serif;
    font-size:10px; /* Чуть меньше */
    font-weight:700;
    letter-spacing:0.12em;
    color: var(--muted);
    text-transform:uppercase;
    opacity: 0.8;
  }
  .round-dots{
    position:absolute;
    top:22px;
    right:28px;
    display:flex;
    gap:7px;
  }
  .dot{
    width:8px; height:8px;
    border-radius:50%;
    background: var(--line);
    transition: all 0.3s ease;
  }
  .dot.filled{ 
    background: var(--pink); 
    box-shadow: 0 0 10px 1px rgba(255,77,148,0.4);
  }

  /* Question Box — эффект глубины (колодец) */
  .question-box{
    width:100%;
    max-width:480px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    /* Градиент имитирует глубину */
    background: linear-gradient(180deg, #0d0714 0%, #150c1e 50%, #0d0714 100%);
    border-radius:16px;
    border:1px solid rgba(0,0,0,0.3);
    /* Глубокая внутренняя тень */
    box-shadow: 
      inset 0 10px 20px rgba(0,0,0,0.5),
      inset 0 -10px 20px rgba(0,0,0,0.5);
    padding: 0 20px;
    overflow-y:auto;
    scrollbar-width:thin;
  }
  
  #question{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.45;
    color: var(--text);
    max-width:480px;
    transition: opacity 0.15s ease;
    /* Легкое свечение тексту */
    text-shadow: 0 0 10px rgba(245,236,255,0.15);
  }
  #question.placeholder{
    color: var(--muted);
    font-weight:400;
    font-size:17px;
    font-family:'Manrope', sans-serif;
    text-shadow: none;
    opacity: 0.7;
  }
  #author{
    min-height:18px;
    font-size:13px;
    font-weight:600;
    color: var(--gold);
    opacity:0;
    transition: opacity 0.2s ease;
    letter-spacing: 0.01em;
  }
  #author.show{ opacity:0.9; }

  .controls{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:28px;
    flex-wrap:wrap;
  }
  
  /* Кнопки улучшены */
  button.main{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.03em;
    padding:16px 30px;
    border-radius:14px; /* Чуть больше */
    border:none;
    cursor:pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  button.main:active{ transform: scale(0.96); }
  button.main:disabled{ opacity:0.4; cursor:not-allowed; box-shadow: none !important; }
  /* Rim light для кнопок */
  button.main::before {
    content:"";
    position: absolute; inset:0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .btn-next{
    background: linear-gradient(135deg, var(--pink), #ff7ab0);
    color:#1a0a12;
    /* Тень с оттенком */
    box-shadow: 0 10px 25px -5px var(--shadow-pink);
  }
  /* Улучшенный блик при ховере */
  .btn-next::after {
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 25%, rgba(255,255,255,0.35) 35%, transparent 45%);
    transform: translateX(-150%);
    transition: none;
  }
  .btn-next:hover:not(:disabled){ 
    box-shadow: 0 12px 30px -2px rgba(255,77,148,0.5); 
    transform: translateY(-1px);
  }
  .btn-next:hover:not(:disabled)::after {
    transform: translateX(150%);
    transition: transform 0.7s shadow-pink;
  }

  .btn-secondary{
    background: rgba(245,236,255,0.03); /* Легкий фон */
    color: var(--muted);
    border:1px solid var(--line);
  }
  .btn-secondary:hover{ 
    color: var(--text); 
    border-color: rgba(245,236,255,0.15); 
    background: rgba(245,236,255,0.06);
  }

  /* Тост улучшен */
  .toast{
    position:fixed;
    bottom:32px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background: #2a1b3d; /* Чуть светлее */
    border:1px solid rgba(245,236,255,0.1);
    color: var(--text);
    font-size:13px;
    font-weight:600;
    padding:12px 22px;
    border-radius:100px;
    opacity:0;
    pointer-events:none;
    transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); /* Пружинисто */
    z-index:10;
    box-shadow: 
      inset 0 1px 0 rgba(255,255,255,0.05),
      0 15px 30px -5px rgba(0,0,0,0.5);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .footnote{
    text-align:center;
    color: var(--muted);
    font-size:12px;
    font-weight: 500;
    margin-top:24px;
    line-height:1.6;
    opacity: 0.8;
  }

  @media (max-width: 480px){
    .stage{ height:400px; padding:48px 28px; gap: 12px; }
    .question-box{ height:260px; padding: 0 16px; }
    #question { font-size: 19px; }
  }

  @media (prefers-reduced-motion: reduce){
    .stage-glow{ animation:none; }
    .stage:hover { transform: none; }
    .btn-next::after { display: none; }
  }
</style>
</head>
<body>

<div class="stage-glow"></div>

<div class="wrap">
  <div class="credit">by kw0rs for <span class="brand">Lounge</span></div>
  <div class="eyebrow">Любовь в вопросах</div>

  <div class="stage">
    <div class="round-label">Вопрос <span id="qnum">—</span> из 3</div>
    <div class="round-dots" id="dots"></div>
    <div class="question-box">
      <div id="question" class="placeholder">Загружаю вопросы…</div>
    </div>
    <div id="author"></div>
  </div>

  <div class="controls">
    <button class="main btn-next" id="nextBtn" disabled>Следующий вопрос →</button>
    <button class="main btn-secondary" id="copyBtn">Копировать</button>
  </div>

  <div class="footnote" id="footnote">Каждые 3 вопроса — новый раунд, дальше по кругу</div>
</div>

<div class="toast" id="toast"></div>

<script>
// Google Sheet: https://docs.google.com/spreadsheets/d/16zuU3f73g0HWwla3uJi8hJarN1ePW1-sw_QESTcBsng
const CSV_URL = "https://docs.google.com/spreadsheets/d/16zuU3f73g0HWwla3uJi8hJarN1ePW1-sw_QESTcBsng/export?format=csv";

let ALL_QUESTIONS = [];

const state = {
  pool: [],
  used: [],
  roundIndex: 0
};

function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){
        if (field !== '' || row.length){ row.push(field); rows.push(row); row = []; field = ''; }
        if (c === '\r' && text[i + 1] === '\n') i++;
      } else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function rebuildPool(){
  state.pool = shuffle(ALL_QUESTIONS.filter(q => !state.used.includes(q.question)));
  if (state.pool.length === 0 && ALL_QUESTIONS.length > 0){
    state.used = [];
    state.pool = shuffle(ALL_QUESTIONS);
  }
}

async function loadQuestionsFromSheet(){
  const footnote = document.getElementById('footnote');
  const nextBtn = document.getElementById('nextBtn');
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('empty sheet');

    const header = rows[0].map(h => h.trim().toLowerCase());
    const qIdx = header.findIndex(h => h.includes('вопрос') && !h.includes('автор'));
    const aIdx = header.findIndex(h => h.includes('автор'));
    if (qIdx === -1) throw new Error('no question column');

    const list = [];
    for (let i = 1; i < rows.length; i++){
      const r = rows[i];
      const question = (r[qIdx] || '').trim();
      if (!question) continue;
      const author = aIdx !== -1 ? (r[aIdx] || '').trim() : '';
      list.push({ question, author });
    }

    if (list.length === 0) throw new Error('no valid rows');

    ALL_QUESTIONS = list;
    footnote.textContent = `Загружено вопросов: ${list.length}. Каждые 3 — новый раунд`;
    nextBtn.disabled = false;
    return true;
  } catch (err){
    footnote.textContent = 'Не удалось загрузить таблицу. Проверь доступ и перезагрузи страницу';
    document.getElementById('question').textContent = 'Таблица недоступна';
    return false;
  }
}

const questionEl = document.getElementById('question');
const authorEl = document.getElementById('author');
const qnumEl = document.getElementById('qnum');
const dotsEl = document.getElementById('dots');
const toastEl = document.getElementById('toast');

function renderDots(){
  dotsEl.innerHTML = '';
  for (let i = 0; i < 3; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < state.roundIndex ? ' filled' : '');
    dotsEl.appendChild(d);
  }
}

function nextQuestion(){
  if (state.pool.length === 0) rebuildPool();
  if (state.pool.length === 0) return;

  const item = state.pool.pop();
  state.used.push(item.question);

  state.roundIndex = state.roundIndex >= 3 ? 1 : state.roundIndex + 1;

  questionEl.classList.remove('placeholder');
  questionEl.style.opacity = 0;
  authorEl.classList.remove('show');
  
  // Чуть быстрее анимация смены
  setTimeout(() => {
    questionEl.textContent = item.question;
    questionEl.style.opacity = 1;
    if (item.author){
      authorEl.textContent = `— вопрос от ${item.author}`;
      authorEl.classList.add('show');
    } else {
      authorEl.textContent = '';
    }
  }, 100);

  qnumEl.textContent = state.roundIndex;
  renderDots();
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if(window.toastTimer) clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

document.getElementById('nextBtn').onclick = nextQuestion;

document.getElementById('copyBtn').onclick = () => {
  const text = questionEl.textContent;
  if (!text || questionEl.classList.contains('placeholder')) {
    showToast('Сначала сгенерируй вопрос');
    return;
  }
  navigator.clipboard.writeText(text).then(() => showToast('Скопировано в буфер')).catch(() => showToast('Не удалось скопировать'));
};

(async function init(){
  renderDots();
  await loadQuestionsFromSheet();
  rebuildPool();
})();
</script>

</body>
</html>
