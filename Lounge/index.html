<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Любовная трибуна — выбор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150c1e;
    --surface: #211432;
    --surface-2: #2c1c40;
    --pink: #ff4d94;
    --gold: #ffcb61;
    --text: #f5ecff;
    --muted: #9d87b3;
    --line: rgba(245,236,255,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 16px 32px;
    position: relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(1px 1px at 12% 22%, rgba(255,203,97,0.5), transparent),
      radial-gradient(1px 1px at 82% 15%, rgba(255,77,148,0.5), transparent),
      radial-gradient(1.5px 1.5px at 68% 78%, rgba(255,203,97,0.4), transparent),
      radial-gradient(1px 1px at 25% 88%, rgba(255,77,148,0.4), transparent),
      radial-gradient(1px 1px at 92% 60%, rgba(245,236,255,0.35), transparent);
    pointer-events:none;
    z-index:0;
    animation: twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.5; }
    50%{ opacity:1; }
  }

  .stage-glow{
    position:fixed;
    top:-24%;
    left:50%;
    transform:translateX(-50%);
    width:960px;
    height:960px;
    background: radial-gradient(circle, rgba(255,77,148,0.16) 0%, rgba(255,203,97,0.05) 35%, transparent 70%);
    filter: blur(10px);
    animation: pulse-glow 6s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes pulse-glow{
    0%,100% { opacity:0.7; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.08); }
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
  }

  /* ===== HEADER ===== */
  .header{
    text-align:center;
    margin-bottom:36px;
  }
  .crest{
    width:52px; height:52px;
    margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background: linear-gradient(160deg, rgba(255,77,148,0.18), rgba(255,203,97,0.1));
    border:1px solid rgba(255,203,97,0.35);
    box-shadow: 0 0 0 6px rgba(255,77,148,0.06), 0 14px 30px -14px rgba(255,77,148,0.6);
  }
  .crest svg{ width:24px; height:24px; }

  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color: var(--gold);
    margin-bottom:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    height:1px;
    width:28px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .eyebrow::after{ background: linear-gradient(90deg, var(--gold), transparent); }

  .headline{
    font-family:'Unbounded', sans-serif;
    font-weight:900;
    font-size: clamp(26px, 4.6vw, 36px);
    letter-spacing:-0.01em;
    margin:0 0 8px;
    background: linear-gradient(135deg, var(--text) 30%, var(--pink) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subline{
    font-size:13.5px;
    color: var(--muted);
    font-weight:600;
    margin:0;
  }

  /* ===== CHOICE CARDS ===== */
  .choice-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:16px;
    margin-bottom:8px;
  }
  @media (max-width: 560px){
    .choice-grid{ grid-template-columns: 1fr; }
  }

  .choice-card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px 24px 24px;
    text-decoration:none;
    color: var(--text);
    box-shadow: 0 30px 60px -28px rgba(0,0,0,0.6);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    overflow:hidden;
  }
  .choice-card::before{
    content:"";
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    top:14px; right:14px;
    background: var(--pink);
    opacity:0.35;
    transition: opacity 0.22s ease;
  }
  .choice-card:hover{
    transform: translateY(-4px);
    border-color: rgba(255,77,148,0.4);
    box-shadow: 0 0 0 1px rgba(255,77,148,0.2), 0 34px 70px -30px rgba(0,0,0,0.65), 0 0 26px -6px rgba(255,77,148,0.35);
  }
  .choice-card:hover::before{ opacity:1; }

  .choice-icon{
    width:46px; height:46px;
    display:flex; align-items:center; justify-content:center;
    border-radius:14px;
    background: rgba(255,203,97,0.1);
    border:1px solid rgba(255,203,97,0.3);
  }
  .choice-icon svg{ width:22px; height:22px; }
  .choice-card.b .choice-icon{
    background: rgba(255,77,148,0.1);
    border-color: rgba(255,77,148,0.3);
  }

  .choice-label{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:-0.01em;
    line-height:1.25;
  }
  .choice-desc{
    font-size:12.5px;
    color: var(--muted);
    font-weight:600;
    line-height:1.5;
    margin:0;
  }
  .choice-go{
    margin-top:auto;
    padding-top:10px;
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Unbounded', sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--gold);
  }
  .choice-card.b .choice-go{ color: var(--pink); }
  .choice-go svg{
    width:13px; height:13px;
    transition: transform 0.22s ease;
  }
  .choice-card:hover .choice-go svg{ transform: translateX(3px); }

  /* ===== FOOTER CREDIT ===== */
  .credit{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:30px;
    font-family:'Manrope', sans-serif;
    font-size:11.5px;
    font-weight:600;
    color: var(--muted);
    letter-spacing:0.03em;
  }
  .credit .dot{
    width:4px; height:4px;
    border-radius:50%;
    background: var(--pink);
    opacity:0.6;
  }
  .credit .brand{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.04em;
    background: linear-gradient(90deg, var(--gold), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
</style>
</head>
<body>

<div class="stage-glow"></div>

<div class="wrap">

  <div class="header">
    <div class="crest">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21s-7.5-4.6-10-9.1C0.3 8.3 2 4.5 5.7 4c2.2-0.3 4.2 0.9 6.3 3 2.1-2.1 4.1-3.3 6.3-3 3.7 0.5 5.4 4.3 3.7 7.9C19.5 16.4 12 21 12 21z" fill="var(--pink)" opacity="0.9"/>
      </svg>
    </div>
    <div class="eyebrow">Ведущие Lounge</div>
    <h1 class="headline">Выбери трибуну</h1>
  </div>

  <div class="choice-grid">

    <a class="choice-card a" href="https://kw0rs.com/Lounge/voprosiki/">
      <div class="choice-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 9a3 3 0 1 1 4 2.83c-.7.26-1 .87-1 1.42V14" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="17.5" r="1" fill="var(--gold)"/>
        </svg>
      </div>
      <div>
        <div class="choice-label">Любовь в вопросах</div>
        <p class="choice-desc">Карточки с вопросами — узнаём друг друга глубже</p>
      </div>
      <span class="choice-go">
        Перейти
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>

    <a class="choice-card b" href="https://kw0rs.com/Lounge/koleso/">
      <div class="choice-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="8" stroke="var(--pink)" stroke-width="2"/>
          <path d="M12 4v16M4 12h16" stroke="var(--pink)" stroke-width="1.4" opacity="0.6"/>
          <circle cx="12" cy="12" r="1.6" fill="var(--pink)"/>
        </svg>
      </div>
      <div>
        <div class="choice-label">Любовное колесо</div>
        <p class="choice-desc">Крути барабан — скипы, время и пол решает случай</p>
      </div>
      <span class="choice-go">
        Перейти
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>

  </div>

  <div class="credit">
    <span>by kw0rs</span>
    <span class="dot"></span>
    <span class="brand">for Lounge</span>
  </div>

</div>

</body>
</html>
